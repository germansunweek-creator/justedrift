<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUST DRIFT — Classement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #15181d;
    --panel-2: #1c2027;
    --line: #262b33;
    --text: #f1ede6;
    --muted: #8b92a0;
    --amber: #ff8a1e;
    --amber-2: #ffb84d;
    --cyan: #29e0c9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 80px;
  }

  /* ===== Hero ===== */
  .hero {
    width: 100%;
    max-width: 900px;
    position: relative;
    padding: 64px 0 40px;
    text-align: center;
    overflow: hidden;
  }
  .skidmark {
    position: absolute;
    top: 30px;
    left: -10%;
    width: 120%;
    height: 140px;
    background: linear-gradient(100deg, transparent 0%, transparent 20%, rgba(255,138,30,0.10) 35%, rgba(255,138,30,0.22) 50%, rgba(41,224,201,0.14) 65%, transparent 82%, transparent 100%);
    filter: blur(6px);
    transform: rotate(-3deg);
    pointer-events: none;
    z-index: 0;
  }
  .eyebrow {
    position: relative;
    z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.28em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  h1 {
    position: relative;
    z-index: 1;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(40px, 9vw, 76px);
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0;
    line-height: 0.95;
    background: linear-gradient(180deg, #ffffff 0%, #c9ccd2 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 span {
    background: linear-gradient(90deg, var(--amber) 0%, var(--amber-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    position: relative;
    z-index: 1;
    font-size: 15px;
    color: var(--muted);
    margin-top: 12px;
  }

  /* ===== Controls ===== */
  .controls {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 28px;
  }
  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  button#refreshBtn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: #0b0d10;
    background: linear-gradient(90deg, var(--amber-2), var(--amber));
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button#refreshBtn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(255,138,30,0.25); }
  button#refreshBtn:active { transform: translateY(0); }
  button#refreshBtn:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

  /* ===== Table ===== */
  table.leaderboard {
    width: 100%;
    max-width: 900px;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  table.leaderboard thead th {
    text-align: left;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--panel-2);
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  table.leaderboard thead th.col-rank { width: 70px; }
  table.leaderboard thead th.col-score { text-align: right; width: 120px; }
  table.leaderboard tbody td {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  table.leaderboard tbody tr:last-child td { border-bottom: none; }
  table.leaderboard tbody tr:nth-child(odd) { background: var(--panel-2); }
  table.leaderboard tbody tr.top1 td { background: rgba(255,138,30,0.08); }
  table.leaderboard tbody tr.top1 { box-shadow: inset 3px 0 0 var(--amber); }
  table.leaderboard tbody tr.top2 { box-shadow: inset 3px 0 0 #b9c0cc; }
  table.leaderboard tbody tr.top3 { box-shadow: inset 3px 0 0 #c98a4b; }
  .td-rank {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    color: var(--muted);
  }
  tr.top1 .td-rank { color: var(--amber-2); font-size: 16px; }
  .td-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 15px;
    text-transform: uppercase;
  }
  .td-car {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .td-score {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    color: var(--cyan);
    text-align: right;
  }
  tr.top1 .td-score { color: var(--amber-2); font-size: 18px; }

  .empty, .error {
    width: 100%;
    max-width: 900px;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .error { color: #ff6b6b; }

  footer {
    margin-top: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #4a505c;
    letter-spacing: 0.05em;
  }

  @media (max-width: 640px) {
    table.leaderboard thead th.col-score { width: 90px; }
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="skidmark"></div>
    <div class="eyebrow">Assetto Corsa &middot; Serveur communautaire</div>
    <h1>JUST <span>DRIFT</span></h1>
    <div class="subtitle">Classement partagé — zone de drift</div>
  </div>

  <div class="controls">
    <div class="status" id="statusText">Chargement...</div>
    <button id="refreshBtn">Actualiser</button>
  </div>

  <div id="tableWrap" style="width:100%; display:flex; justify-content:center;">
    <table class="leaderboard" id="leaderboardTable" style="display:none;">
      <thead>
        <tr>
          <th class="col-rank">Rang</th>
          <th>Pilote</th>
          <th class="col-score">Score</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="empty" style="display:none;">Aucun score enregistré pour le moment. Sois le premier à envoyer un temps !</div>
  <div id="errorState" class="error" style="display:none;"></div>

  <footer>JUST DRIFT — DRIFT ZONE CHALLENGE</footer>

<script>
  const SHEETY_URL = "https://api.sheety.co/97a1c625d8087df7f49cea7d676980ee/leaderboard/leaderboard";

  const statusText = document.getElementById('statusText');
  const refreshBtn = document.getElementById('refreshBtn');
  const tableEl = document.getElementById('leaderboardTable');
  const bodyEl = document.getElementById('leaderboardBody');
  const emptyEl = document.getElementById('emptyState');
  const errorEl = document.getElementById('errorState');

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function medal(rank) {
    if (rank === 1) return '🥇';
    if (rank === 2) return '🥈';
    if (rank === 3) return '🥉';
    return '#' + rank;
  }

  async function loadLeaderboard() {
    refreshBtn.disabled = true;
    statusText.textContent = 'Chargement...';
    errorEl.style.display = 'none';
    emptyEl.style.display = 'none';

    try {
      const res = await fetch(SHEETY_URL);
      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }
      const data = await res.json();
      const rows = data.leaderboard || [];

      const bestByPlayer = {};
      for (const row of rows) {
        const name = (row.name || '?').toString();
        const score = Number(row.score || 0);
        if (!bestByPlayer[name] || score > bestByPlayer[name].score) {
          bestByPlayer[name] = { name, car: row.car || '', score };
        }
      }
      const list = Object.values(bestByPlayer).sort((a, b) => b.score - a.score);

      render(list);
      const now = new Date();
      statusText.textContent = 'Mis à jour à ' + now.toLocaleTimeString('fr-FR');
    } catch (err) {
      tableEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.textContent = "Impossible de charger le classement (" + err.message + "). Réessaie dans un instant.";
      statusText.textContent = 'Erreur';
    } finally {
      refreshBtn.disabled = false;
    }
  }

  function render(list) {
    if (list.length === 0) {
      tableEl.style.display = 'none';
      emptyEl.style.display = 'block';
      return;
    }

    const topClass = ['top1', 'top2', 'top3'];
    bodyEl.innerHTML = list.map((p, i) => {
      const rank = i + 1;
      const cls = topClass[i] ? ' class="' + topClass[i] + '"' : '';
      return `
        <tr${cls}>
          <td class="td-rank">${rank <= 3 ? medal(rank) : '#' + rank}</td>
          <td>
            <div class="td-name">${escapeHtml(p.name)}</div>
            <div class="td-car">${escapeHtml(p.car)}</div>
          </td>
          <td class="td-score">${Math.floor(p.score)}</td>
        </tr>`;
    }).join('');
    tableEl.style.display = 'table';

    emptyEl.style.display = 'none';
    errorEl.style.display = 'none';
  }

  refreshBtn.addEventListener('click', loadLeaderboard);
  loadLeaderboard();
</script>

</body>
</html>
