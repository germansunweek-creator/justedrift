<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUST DRIFT — Classement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #15181d;
    --panel-2: #1c2027;
    --line: #262b33;
    --text: #f1ede6;
    --muted: #8b92a0;
    --amber: #ff8a1e;
    --amber-2: #ffb84d;
    --cyan: #29e0c9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px 80px;
  }

  .hero {
    width: 100%;
    max-width: 900px;
    position: relative;
    padding: 64px 0 40px;
    text-align: center;
    overflow: hidden;
  }
  .skidmark {
    position: absolute;
    top: 30px;
    left: -10%;
    width: 120%;
    height: 140px;
    background: linear-gradient(100deg, transparent 0%, transparent 20%, rgba(255,138,30,0.10) 35%, rgba(255,138,30,0.22) 50%, rgba(41,224,201,0.14) 65%, transparent 82%, transparent 100%);
    filter: blur(6px);
    transform: rotate(-3deg);
    pointer-events: none;
    z-index: 0;
  }
  .eyebrow {
    position: relative;
    z-index: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.28em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  h1 {
    position: relative;
    z-index: 1;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(40px, 9vw, 76px);
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0;
    line-height: 0.95;
    background: linear-gradient(180deg, #ffffff 0%, #c9ccd2 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 span {
    background: linear-gradient(90deg, var(--amber) 0%, var(--amber-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    position: relative;
    z-index: 1;
    font-size: 15px;
    color: var(--muted);
    margin-top: 12px;
  }

  .controls {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 28px;
  }
  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  button#refreshBtn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: #0b0d10;
    background: linear-gradient(90deg, var(--amber-2), var(--amber));
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button#refreshBtn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(255,138,30,0.25); }
  button#refreshBtn:active { transform: translateY(0); }
  button#refreshBtn:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

  table.leaderboard {
    width: 100%;
    max-width: 900px;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  table.leaderboard thead th {
    text-align: left;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
